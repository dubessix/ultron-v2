# Ultron V1 - Production Configuration File
# Target Environment: Windows 11 & Linux Ubuntu 24.04 (8GB RAM Host)

ultron:
  name: "ULTRON"
  version: "1.0.0"
  status: "personal-v1-release-candidate"

server:
  host: "127.0.0.1"
  backend_port: 8000
  frontend_port: 5173
  startup_timeout_seconds: 45

ai:
  primary_provider: "groq"
  secondary_provider: "gemini"
  timeout_seconds: 30
  # Legacy key name; runtime treats this as total attempts per provider (1-4).
  max_retries: 3
  rate_limit_backoff_base_seconds: 2.0
  # Model IDs are configurable (env override: GROQ_CHAT_MODEL / GEMINI_CHAT_MODEL /
  # NVIDIA_CHAT_MODEL / GEMINI_EMBEDDING_MODEL / GEMINI_EMBEDDING_DIMS).
  # Verified against provider documentation on 2026-08-23.
  models:
    groq: "openai/gpt-oss-120b"
    gemini: "gemini-3.5-flash"
    nvidia: "nvidia/nemotron-3-ultra-550b-a55b"
    embedding: "gemini-embedding-001"
  embedding_dimensions: 768

memory:
  duplicate_similarity_threshold: 0.95
  low_density_keywords:
    - "hi"
    - "hello"
    - "hey"
    - "greetings"
    - "good morning"
    - "good afternoon"
    - "good night"
    - "thanks"
    - "thank you"
    - "welcome"
    - "test"

durability:
  # One verified SQLite snapshot per day. The newest 30 generations are kept.
  automatic_backups: true
  backup_interval_hours: 24
  backup_generations: 30
  integrity_check_interval_hours: 24
  wal_checkpoint_interval_hours: 6
  # Retention affects generated audit/cache/log data only—never chats or memories.
  audit_retention_days: 90
  cache_retention_days: 7
  log_retention_days: 30
  scheduler_poll_seconds: 900
  restore_lock_timeout_seconds: 30

voice:
  # Edge TTS is the single existing on-demand engine. These approved phrases are
  # a release contract mirrored by the tested browser hook; no broad aliases.
  wake_words:
    - "hey ultron"
    - "ultron"
  ultron:
    voice_id: "en-US-GuyNeural"
    rate: "+5%"
    pitch: "+0Hz"
  zora:
    voice_id: "en-IN-NeerjaNeural"
    rate: "-5%"
    pitch: "+2Hz"

security:
  confirm_level_2: true
  confirm_level_3: true
  # JARVIS FULL ACCESS (owner request): Ultron may work in ANY folder on this PC
  # (Desktop, Documents, Downloads, every drive) and auto-finds folders by name.
  # Still always blocked: OS system folders (blocked_directories + built-ins)
  # and secret files (.ssh, .env, keys, credentials).
  # Delete / move / rename / overwrite / shell commands still show ONE Approve card.
  # Set access_mode: allowlist to go back to only the folders listed below.
  access_mode: full
  allowed_directories: ["."]
  empty_allowed_policy: "project_only"
  # Canonical project ID -> root used by the coding agent. Relative roots resolve
  # below ULTRON_HOME; add another ID only when its root is also allowlisted above.
  project_roots:
    personal: "."
  blocked_directories: ["/etc", "/var", "C:\\Windows", "C:\\System32"]
  # JARVIS SHELL (owner request): any command may run after you approve it.
  # Disk-wiping patterns (rm -rf /, format, fork bombs, shutdown...) stay blocked.
  # Set terminal_policy: allowlist to allow only the commands listed below.
  terminal_policy: any
  terminal_allowed_commands:
    - git
    - python
    - python3
    - pytest
    - pip
    - pip3
    - node
    - npm
    - npx
    - yarn
    - pnpm
    - uvicorn
    - ls
    - pwd
    - cat
    - grep
    - find
    - head
    - tail
    - echo
    - printf
    - diff
    - sort
    - wc
    - cut
    - awk
    - sed
    - make
    - cmake
    - go
    - cargo
    - rustc
    - dotnet
    - sleep

personalities:
  stress_threshold: 0.75
  cooldown_turns: 3
