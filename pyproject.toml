[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Actionable correctness/security-adjacent rules; stylistic mass rewrites are
# intentionally excluded from the final reliability gate.
select = ["E4", "E7", "E9", "F", "B", "RUF012", "RUF013", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately import after environment setup and often keep
# unused loop/index values to model protocol behavior.
"tests/**/*.py" = ["E402", "B007", "RUF059"]

[tool.coverage.run]
source = ["backend", "launcher"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
